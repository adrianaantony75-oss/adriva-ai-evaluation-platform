services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: adriva_migration
      POSTGRES_DB: adriva
      POSTGRES_PASSWORD: ${ADRIVA_POSTGRES_PASSWORD:?Set a local database password in .env}
      ADRIVA_RUNTIME_PASSWORD: ${ADRIVA_RUNTIME_PASSWORD:?Set a separate runtime password in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adriva_migration -d adriva"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      ADRIVA_DATABASE_URL: postgresql://adriva:${ADRIVA_RUNTIME_PASSWORD}@db:5432/adriva
      ADRIVA_ENVIRONMENT: development
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["artifact_data:/app/artifacts"]
    depends_on:
      db:
        condition: service_healthy
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      ADRIVA_DATABASE_URL: postgresql://adriva_migration:${ADRIVA_POSTGRES_PASSWORD}@db:5432/adriva
    command: ["adriva", "migrate"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/Dockerfile
    environment:
      ADRIVA_DATABASE_URL: postgresql://adriva:${ADRIVA_RUNTIME_PASSWORD}@db:5432/adriva
    volumes: ["artifact_data:/app/artifacts"]
    command: ["python", "-m", "adriva.workers.runner", "--watch"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  artifact_data:
