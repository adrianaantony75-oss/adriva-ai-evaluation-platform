[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adriva"
version = "0.1.0"
description = "Multilingual AI evaluation evidence foundation"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.142.2", "uvicorn==0.54.0", "pydantic==2.13.5", "pydantic-settings==2.15.0", "psycopg==3.3.6"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.9"]

[project.scripts]
adriva = "adriva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adriva.db" = ["migrations/*.sql"]
"adriva" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
