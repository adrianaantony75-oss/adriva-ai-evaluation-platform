name: ADRIVA verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: adriva_test
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: adriva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adriva_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADRIVA_TEST_DATABASE_URL: postgresql://adriva_test:ci-only-test-password@localhost:5432/adriva_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: pip install --no-deps -e backend
      - run: ruff check --config backend/pyproject.toml backend tools
      - run: ruff format --check --config backend/pyproject.toml backend tools
      - run: mkdir -p .local && pytest backend/tests -q --basetemp .local/pytest-ci
